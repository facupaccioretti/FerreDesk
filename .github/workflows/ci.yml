name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ferredesk_v0/backend/requirements-ci.txt

      - name: Install backend lint dependencies
        run: python -m pip install -r ferredesk_v0/backend/requirements-ci.txt

      - name: Lint backend
        working-directory: ferredesk_v0/backend
        run: >-
          ruff check ferredesk_backend tenants acceso_publico ferreapps
          --select E9,F63,F7,F82
          --exclude migrations
          --per-file-ignores
          "ferreapps/cuenta_corriente/views/views_proveedor.py:F821,ferreapps/proveedores/views.py:F821"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ferredesk_v0/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ferredesk_v0/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ferredesk_v0/frontend
        run: npx eslint src --ext .js,.jsx --ignore-pattern '*.test.js' --ignore-pattern setupTests.js --max-warnings=0

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ferredesk_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ferredesk_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: ferredesk_backend.settings.ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ferredesk_ci
      SECRET_KEY: ci-only-secret-key
      PUBLIC_BASE_URL: https://lvh.me
      FRONTEND_URL: https://lvh.me
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ferredesk_v0/backend/requirements.txt
            ferredesk_v0/backend/requirements-ci.txt

      - name: Install backend dependencies
        working-directory: ferredesk_v0/backend
        run: python -m pip install -r requirements.txt -r requirements-ci.txt

      - name: Run backend tests with coverage
        working-directory: ferredesk_v0/backend
        run: coverage run manage.py test --verbosity 1

      - name: Publish coverage summary
        if: always()
        working-directory: ferredesk_v0/backend
        run: |
          coverage report --format=markdown | tee coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          coverage xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            ferredesk_v0/backend/coverage.xml
            ferredesk_v0/backend/coverage-summary.md

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ferredesk_v0/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ferredesk_v0/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ferredesk_v0/frontend
        run: npm test -- --watchAll=false --runInBand
